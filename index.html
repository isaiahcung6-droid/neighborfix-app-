    <!-- Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, off, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        notifSound.volume = 1.0;

        document.addEventListener('click', () => {
            notifSound.play().then(() => {
                notifSound.pause();
                notifSound.currentTime = 0;
            }).catch(() => {});
        }, { once: true });

        const firebaseConfig = {
          apiKey: "AIzaSyBTrOCRMWMSklrIIdCacuEk_ApidP3kzJA",
          authDomain: "neighborfix-5eb34.firebaseapp.com",
          projectId: "neighborfix-5eb34",
          storageBucket: "neighborfix-5eb34.firebasestorage.app",
          messagingSenderId: "959574439817",
          appId: "1:959574439817:web:6e668499b044686de0d358",
          measurementId: "G-JMXYLN6FQ8"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch(e) {
            console.log("Firebase Init Warning:", e);
        }

        let activeChatRef = null;
        let stripe = null;
        let cardElement = null;
        let providerCardElement = null;
        let cardMounted = false;
        let providerCardMounted = false;

        let deviceSessionId = localStorage.getItem('nf_device_session');
        if (!deviceSessionId) {
            deviceSessionId = 'device_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('nf_device_session', deviceSessionId);
        }

        try {
            if (typeof Stripe !== 'undefined') {
                const STRIPE_LIVE_PUBLISHABLE_KEY = "pk_live_YOUR_ACTUAL_LIVE_KEY_HERE";
                stripe = Stripe(STRIPE_LIVE_PUBLISHABLE_KEY);
                const elements = stripe.elements();
                cardElement = elements.create('card');
                providerCardElement = elements.create('card');
            }
        } catch (e) {
            console.log("Stripe initialization skipped:", e);
        }
        
        let currentLang = 'en';
        let userLat = null;
        let userLng = null;
        let currentCategory = 'all';
        let currentChatProvider = '';
        let currentChatId = '';
        let pendingBookingMessageKey = null;

        const ADMIN_LIST = ["isaiah cung", "rising star music studio"];
        
        let providers = [];
        let vipMembers = JSON.parse(localStorage.getItem('nf_vip_members')) || ADMIN_LIST;
        let cloudNotifications = {};

        let loggedInProviderName = localStorage.getItem('nf_logged_provider') || "Rising Star Music Studio";
        document.getElementById('pName').value = loggedInProviderName;

        window.updateActiveProviderView = function() {
            const val = document.getElementById('pName').value.trim();
            if (val) {
                loggedInProviderName = val;
                localStorage.setItem('nf_logged_provider', val);
                updateNotifBadge();
            }
        };

        if (db) {
            const cloudProvidersRef = ref(db, 'global_providers');
            onValue(cloudProvidersRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    providers = Object.values(data);
                } else {
                    providers = [];
                }
                filterProviders();
            });

            const cloudNotifRef = ref(db, 'notifications');
            onValue(cloudNotifRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    cloudNotifications = data;
                    checkForNewIncomingAlerts(data);
                } else {
                    cloudNotifications = {};
                }
                updateNotifBadge();
            });
        }

        function checkForNewIncomingAlerts(data) {
            const cleanKey = loggedInProviderName.replace(/\s+/g, '_').toLowerCase();
            const pNotifs = data[cleanKey] || data['isaiah_cung'] || data['rising_star_music_studio'];
            if (pNotifs) {
                const entries = Object.values(pNotifs);
                const latest = entries[entries.length - 1];
                if (latest && latest.unread && (Date.now() - latest.timestamp < 15000)) {
                    notifSound.play().catch(e => console.log(e));
                }
            }
        }

        window.deleteAccountData = function() {
            if (confirm("Are you sure you want to permanently clear database entries and local cache?")) {
                if (db) {
                    set(ref(db, 'global_providers'), null);
                    set(ref(db, 'chats'), null);
                    set(ref(db, 'notifications'), null);
                }
                localStorage.clear();
                providers = [];
                filterProviders();
                alert("Database nodes cleared and stale cache wiped!");
                location.reload();
            }
        };

        function addCloudNotification(providerName, text) {
            if (!db) return;
            const cleanProviderKey = providerName.replace(/\s+/g, '_').toLowerCase();
            const providerNotifRef = ref(db, 'notifications/' + cleanProviderKey);
            
            push(providerNotifRef, {
                text: text,
                time: "Just now",
                timestamp: Date.now(),
                unread: true
            });

            notifSound.play().catch(err => {
                console.log("Audio play allowed:", err);
            });
        }

        function updateNotifBadge() {
            let totalUnread = 0;
            const cleanKey = loggedInProviderName.replace(/\s+/g, '_').toLowerCase();
            
            const checkKeys = [cleanKey, 'isaiah_cung', 'rising_star_music_studio'];

            checkKeys.forEach(key => {
                const pNotifs = cloudNotifications[key];
                if (pNotifs) {
                    Object.values(pNotifs).forEach(n => {
                        if (n.unread) totalUnread++;
                    });
                }
            });

            const badge = document.getElementById('notifBadge');
            if (totalUnread > 0) {
                badge.innerText = totalUnread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.openNotificationModal = function() {
            document.getElementById('activeProviderNotifLabel').innerText = loggedInProviderName;
            renderCloudNotifications();
            document.getElementById('notificationModal').classList.remove('hidden');
        };

        function renderCloudNotifications() {
            const listContainer = document.getElementById('notificationList');
            if (!listContainer) return;

            const cleanKey = loggedInProviderName.replace(/\s+/g, '_').toLowerCase();
            let providerNotifsObj = cloudNotifications[cleanKey] || {};
            
            providerNotifsObj = { 
                ...(cloudNotifications['isaiah_cung'] || {}), 
                ...(cloudNotifications['rising_star_music_studio'] || {}),
                ...providerNotifsObj 
            };

            const notifsArray = Object.entries(providerNotifsObj).map(([id, val]) => ({ id, ...val })).sort((a, b) => b.timestamp - a.timestamp);

            if (notifsArray.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-center text-slate-400 py-6">No incoming booking alerts found for "${loggedInProviderName}".</p>`;
            } else {
                listContainer.innerHTML = notifsArray.map(n => `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex flex-col space-y-1 shadow-sm">
                        <p class="text-slate-900 font-bold text-xs"><i class="fa-solid fa-bell text-amber-600 mr-1"></i> ${n.text}</p>
                        <span class="text-[10px] text-slate-500">${n.time}</span>
                    </div>
                `).join('');
            }
        }

        window.closeNotificationModal = function() {
            document.getElementById('notificationModal').classList.add('hidden');
        };

        window.clearNotifications = function() {
            if (!db) return;
            const cleanKey = loggedInProviderName.replace(/\s+/g, '_').toLowerCase();
            set(ref(db, 'notifications/' + cleanKey), null);
            set(ref(db, 'notifications/isaiah_cung'), null);
            set(ref(db, 'notifications/rising_star_music_studio'), null);
            renderCloudNotifications();
            updateNotifBadge();
        };

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgBase64 = e.target.result;
                    document.getElementById('profilePreview').src = imgBase64;
                    document.getElementById('pImgData').value = imgBase64;
                };
                reader.readAsDataURL(file);
            }
        };

        window.updateListingFeeUI = function() {
            const selectedPlan = document.querySelector('input[name="plan"]:checked') ? document.querySelector('input[name="plan"]:checked').value : 'standard';
            const paymentSection = document.getElementById('paymentSectionContainer');
            const submitBtn = document.getElementById('submitBtn');

            if (selectedPlan === 'vip') {
                paymentSection.classList.remove('hidden');
                submitBtn.innerText = "Upgrade to Lifetime VIP ($25.00)";
                if (cardElement && !cardMounted) {
                    try {
                        cardElement.mount('#card-element');
                        cardMounted = true;
                    } catch(err) { console.log(err); }
                }
            } else {
                paymentSection.classList.add('hidden');
                submitBtn.innerText = "Publish Standard Listing (Free)";
            }
        };

        document.querySelectorAll('input[name="plan"]').forEach(radio => {
            radio.addEventListener('change', window.updateListingFeeUI);
        });

        window.getUserLocation = function() {
            const gpsText = document.getElementById('gpsText');
            if (navigator.geolocation) {
                gpsText.innerText = "Accessing GPS location...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        gpsText.innerText = `GPS Active: (${userLat.toFixed(2)}, ${userLng.toFixed(2)})`;
                        filterProviders();
                    },
                    (error) => { gpsText.innerText = "GPS Disabled / Using default location."; }
                );
            } else { gpsText.innerText = "Geolocation not supported."; }
        };

        window.resetToHomeAllServices = function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
            
            currentCategory = 'all';
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm', 'shadow-emerald-200');
                btn.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
            });
            const allBtn = document.getElementById('catBtnAll');
            if (allBtn) {
                allBtn.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
                allBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-sm', 'shadow-emerald-200');
            }

            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';

            filterProviders();
        };

        function renderProviders(list) {
            const container = document.getElementById('providerList');
            const activeList = list.filter(p => p.active !== false);
            document.getElementById('providerCount').innerText = `${activeList.length} providers`;
            
            if(!activeList || activeList.length === 0) {
                container.innerHTML = '<p class="text-xs text-center text-slate-400 py-6">No active providers found in this category.</p>';
                return;
            }

            const sortedList = [...activeList].sort((a, b) => (b.isVip ? 1 : 0) - (a.isVip ? 1 : 0));

            container.innerHTML = '';
            sortedList.forEach(p => {
                const imgUrl = p.img || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";
                const providerLocation = p.location || "Greenwood, Indiana, USA";

                const currentUser = (document.getElementById('pName').value || "").trim().toLowerCase();
                const canEdit = ADMIN_LIST.includes(currentUser) || (currentUser && currentUser === p.name.toLowerCase());
                const encodedName = btoa(encodeURIComponent(p.name));

                const cardDiv = document.createElement('div');
                cardDiv.className = `provider-card bg-white border ${p.isVip ? 'border-amber-300 ring-1 ring-amber-200' : 'border-slate-100'} rounded-2xl p-4 shadow-sm relative`;
                
                cardDiv.innerHTML = `
                    ${p.isVip ? '<span class="absolute -top-2.5 right-4 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold text-[10px] px-2.5 py-0.5 rounded-full shadow-sm"><i class="fa-solid fa-crown mr-1"></i> VIP Featured</span>' : ''}
                    <div class="flex items-start justify-between">
                        <div class="flex space-x-3">
                            <img src="${imgUrl}" alt="${p.name}" class="w-14 h-14 rounded-2xl object-cover shadow-sm">
                            <div>
                                <h3 class="font-bold text-slate-900">${p.name}</h3>
                                <p class="text-xs text-emerald-600 font-semibold mt-0.5">${p.title}</p>
                                <div class="flex items-center space-x-2 mt-1.5 text-xs text-slate-500">
                                    <span class="text-amber-500 font-bold flex items-center"><i class="fa-solid fa-star mr-1"></i> ${p.rating}</span>
                                    <span>•</span>
                                    <span class="text-slate-600 font-medium flex items-center"><i class="fa-solid fa-earth-americas text-emerald-600 mr-1"></i> ${providerLocation}</span>
                                </div>
                            </div>
                        </div>
                        <span class="bg-emerald-50 text-emerald-700 font-bold text-xs px-2.5 py-1 rounded-lg">${p.rate}</span>
                    </div>
                    <p class="text-xs text-slate-600 mt-3 leading-relaxed">${p.desc}</p>
                    
                    <div class="mt-3 bg-slate-50 border border-slate-200/80 rounded-xl p-2 text-center text-[11px] text-slate-500 font-medium">
                        <i class="fa-solid fa-lock mr-1 text-slate-400"></i> Contact phone locked (Chat & request booking to unlock)
                    </div>

                    <div class="flex space-x-2 mt-3">
                        <button type="button" class="chat-btn-action flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 shadow-sm shadow-emerald-100 cursor-pointer">
                            <i class="fa-solid fa-comments"></i>
                            <span>Chat & Inquire</span>
                        </button>
                        ${canEdit ? `
                        <button type="button" class="edit-btn-action bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-2.5 rounded-xl text-xs flex items-center justify-center cursor-pointer" title="Edit Profile">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>` : ''}
                    </div>
                `;

                const chatBtn = cardDiv.querySelector('.chat-btn-action');
                if (chatBtn) {
                    chatBtn.addEventListener('click', () => {
                        window.openChatByB64(encodedName);
                    });
                }

                const editBtn = cardDiv.querySelector('.edit-btn-action');
                if (editBtn) {
                    editBtn.addEventListener('click', () => {
                        window.openEditModal(p.id);
                    });
                }

                container.appendChild(cardDiv);
            });
        }

        window.openMapModal = function(name, lat, lng) {
            document.getElementById('mapTitle').innerText = name + " Location Map";
            document.getElementById('googleMapIframe').src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
            document.getElementById('getDirectionBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            document.getElementById('mapModal').classList.remove('hidden');
        };

        window.closeMapModal = function() { document.getElementById('mapModal').classList.add('hidden'); };

        window.capturePostLocation = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('pLat').value = pos.coords.latitude;
                    document.getElementById('pLng').value = pos.coords.longitude;
                    document.getElementById('gpsPostBtnText').innerText = "GPS Location Captured ✓";
                });
            }
        };

        window.openPostModal = function() {
            document.getElementById('editProviderId').value = "";
            document.getElementById('modalTitle').innerText = "Post Your Service Listing";
            document.getElementById('providerForm').reset();
            document.getElementById('profilePreview').src = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";
            document.getElementById('pImgData').value = "";
            document.getElementById('pLocation').value = "Greenwood, Indiana, USA";
            document.getElementById('postModal').classList.remove('hidden');
            window.updateListingFeeUI();
        };

        window.openEditModal = function(id) {
            const p = providers.find(item => item.id == id);
            if (!p) return;

            document.getElementById('editProviderId').value = p.id;
            document.getElementById('modalTitle').innerText = "Edit Your Profile / Listing";
            document.getElementById('pName').value = p.name;
            
            const currentImg = p.img || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";
            document.getElementById('profilePreview').src = currentImg;
            document.getElementById('pImgData').value = currentImg;

            document.getElementById('pCategory').value = p.category;
            document.getElementById('pLocation').value = p.location || "Greenwood, Indiana, USA";
            document.getElementById('pTitle').value = p.title;
            document.getElementById('pRate').value = p.rate;
            document.getElementById('pPhone').value = p.phone;
            document.getElementById('pDesc').value = p.desc;
            document.getElementById('pLat').value = p.lat;
            document.getElementById('pLng').value = p.lng;

            document.getElementById('postModal').classList.remove('hidden');
            window.updateListingFeeUI();
        };

        window.closePostModal = function() { document.getElementById('postModal').classList.add('hidden'); };

        window.saveProvider = function(e) {
            e.preventDefault();
            
            try {
                const editId = document.getElementById('editProviderId').value;
                const providerName = document.getElementById('pName').value.trim();
                const providerImg = document.getElementById('pImgData').value || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";
                const serviceTitle = document.getElementById('pTitle').value.trim();
                const locationStr = document.getElementById('pLocation').value.trim();
                const selectedPlan = document.querySelector('input[name="plan"]:checked') ? document.querySelector('input[name="plan"]:checked').value : 'standard';

                if (!vipMembers.includes(providerName.toLowerCase()) && selectedPlan === 'vip') {
                    vipMembers.push(providerName.toLowerCase());
                    localStorage.setItem('nf_vip_members', JSON.stringify(vipMembers));
                }

                const isAlreadyVip = ADMIN_LIST.includes(providerName.toLowerCase()) || vipMembers.includes(providerName.toLowerCase()) || selectedPlan === 'vip';
                const providerId = editId ? editId : 'p_' + Date.now();

                const newProvider = {
                    id: providerId,
                    name: providerName,
                    img: providerImg,
                    category: document.getElementById('pCategory').value,
                    location: locationStr,
                    title: serviceTitle,
                    rate: document.getElementById('pRate').value,
                    phone: document.getElementById('pPhone').value.trim(),
                    desc: document.getElementById('pDesc').value,
                    isVip: isAlreadyVip,
                    active: true,
                    lat: parseFloat(document.getElementById('pLat').value) || 39.6137,
                    lng: parseFloat(document.getElementById('pLng').value) || -86.1064,
                    rating: "5.0"
                };

                if (db) {
                    set(ref(db, 'global_providers/' + providerId), newProvider);
                }

                closePostModal();
                loggedInProviderName = providerName;
                localStorage.setItem('nf_logged_provider', providerName);
                addCloudNotification(providerName, `Listing Published: "${serviceTitle}" (${locationStr})`);
                alert("Listing successfully published globally!");
            } catch(err) {
                console.error("Save Error:", err);
                alert("Error saving listing to cloud. Please try again.");
            }
        };

        window.filterCat = function(e, cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm', 'shadow-emerald-200');
                btn.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
            });
            e.target.closest('button').classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
            e.target.closest('button').classList.add('bg-emerald-600', 'text-white', 'shadow-sm', 'shadow-emerald-200');

            filterProviders();
        };

        window.filterProviders = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = providers.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.category === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(query) || p.title.toLowerCase().includes(query) || (p.location && p.location.toLowerCase().includes(query)) || p.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProviders(filtered);
        };

        window.openChatByB64 = function(b64Name) {
            try {
                const realName = decodeURIComponent(atob(b64Name));
                window.openChat(realName);
            } catch(e) {
                console.error("Chat open error:", e);
            }
        };

        window.openChat = function(name) {
            currentChatProvider = name;
            document.getElementById('chatTitle').innerText = "Chat & Inquire – " + name;
            const msgBox = document.getElementById('chatMessages');
            msgBox.innerHTML = '';
            document.getElementById('bookingDrawer').classList.add('hidden');

            if (activeChatRef && db) {
                off(activeChatRef);
            }

            const providerKey = name.replace(/\s+/g, '_').toLowerCase();
            currentChatId = `${providerKey}_shared_chat`;

            loadChatMessages(currentChatId);
            document.getElementById('chatModal').classList.remove('hidden');
        };

        window.toggleBookingDrawer = function() {
            const drawer = document.getElementById('bookingDrawer');
            drawer.classList.toggle('hidden');
        };

        window.sendTextMessage = function() {
            const input = document.getElementById('chatMessageInput');
            const text = input.value.trim();
            if (!text) return;

            if (!db || !currentChatId) return;

            const chatListRef = ref(db, 'chats/' + currentChatId);

            push(chatListRef, {
                sender: 'user',
                type: 'text_message',
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
            addCloudNotification(currentChatProvider, `New message sent to ${currentChatProvider}.`);
        };

        window.sendBookingRequest = function() {
            const dateVal = document.getElementById('bookingDateInput').value;
            const timeVal = document.getElementById('bookingTimeInput').value;
            const noteVal = document.getElementById('bookingNoteInput').value.trim();

            if (!dateVal || !timeVal) {
                alert("Please select both Date and Time for your booking request.");
                return;
            }

            if (!db || !currentChatId) return;

            const chatListRef = ref(db, 'chats/' + currentChatId);

            push(chatListRef, {
                sender: 'user',
                type: 'booking_request',
                date: dateVal,
                time: timeVal,
                note: noteVal || "No additional notes",
                status: 'pending',
                timestamp: Date.now()
            });

            document.getElementById('bookingDateInput').value = '';
            document.getElementById('bookingTimeInput').value = '';
            document.getElementById('bookingNoteInput').value = '';
            document.getElementById('bookingDrawer').classList.add('hidden');
            
            addCloudNotification(currentChatProvider, `New Booking Request received for ${dateVal} at ${timeVal}!`);
            alert("Booking request sent successfully to provider!");
        };

        function loadChatMessages(chatId) {
            if (!db) return;
            activeChatRef = ref(db, 'chats/' + chatId);
            onChildAdded(activeChatRef, (snapshot) => {
                const msg = snapshot.val();
                const key = snapshot.key;
                appendMessageToUI(msg, key);
            });
        }

        window.closeChat = function() { 
            if (activeChatRef && db) off(activeChatRef);
            document.getElementById('chatModal').classList.add('hidden'); 
        };

        window.initiateBookingAccept = function(msgKey) {
            pendingBookingMessageKey = msgKey;
            const isAdmin = ADMIN_LIST.includes(currentChatProvider.toLowerCase());

            if (isAdmin) {
                processProviderFeeAndConfirm(true);
            } else {
                const providerObj = providers.find(p => p.name.toLowerCase() === currentChatProvider.toLowerCase());
                const isVip = providerObj ? providerObj.isVip : false;
                const feeAmount = isVip ? "$8.00" : "$10.00";

                document.getElementById('feeDescriptionText').innerText = `Accepting this booking requires a System Lead Fee (${feeAmount}). Once confirmed, fee is non-refundable regardless of job execution.`;

                document.getElementById('confirmFeeModal').classList.remove('hidden');
                if (providerCardElement && !providerCardMounted) {
                    try {
                        providerCardElement.mount('#provider-card-element');
                        providerCardMounted = true;
                    } catch(e) { console.log(e); }
                }
            }
        };

        window.closeFeeModal = function() {
            document.getElementById('confirmFeeModal').classList.add('hidden');
        };

        window.processProviderFeeAndConfirm = async function(isBypass = false) {
            const btn = document.getElementById('payConfirmBtn');
            btn.disabled = true;
            btn.innerText = "Processing Live Payment...";

            if (!isBypass && stripe && providerCardElement) {
                const res = await stripe.createToken(providerCardElement, { name: currentChatProvider });
                if (res.error) {
                    alert(res.error.message);
                    btn.disabled = false;
                    btn.innerText = "Confirm & Accept";
                    return;
                }
            }

            if (db && pendingBookingMessageKey && currentChatId) {
                const msgRef = ref(db, `chats/${currentChatId}/${pendingBookingMessageKey}`);
                
                update(msgRef, { 
                    status: 'accepted',
                    acceptedAt: Date.now() 
                });
                addCloudNotification(currentChatProvider, `Booking confirmed and lead unlocked successfully!`);
            }

            btn.disabled = false;
            btn.innerText = "Confirm & Accept";
            closeFeeModal();
            alert(isBypass ? "Admin Booking Approved (Fee Bypassed)!" : "Live Payment Successful & Booking Confirmed!");
        };

        window.cancelBookingRequest = function(msgKey) {
            if (db && currentChatId && confirm("Are you sure you want to cancel/decline this booking request?")) {
                const msgRef = ref(db, `chats/${currentChatId}/${msgKey}`);
                update(msgRef, { status: 'cancelled' });
            }
        };

        function appendMessageToUI(m, msgKey) {
            const msgBox = document.getElementById('chatMessages');
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = "flex flex-col my-1.5";

            if (m.type === 'text_message') {
                wrapperDiv.className += " items-start";
                wrapperDiv.innerHTML = `
                    <div class="bg-slate-200 text-slate-800 rounded-2xl px-3 py-2 text-xs max-w-[80%] shadow-sm">
                        ${m.text}
                    </div>
                `;
                msgBox.appendChild(wrapperDiv);
                msgBox.scrollTop = msgBox.scrollHeight;
            } 
            else if (m.type === 'booking_request') {
                wrapperDiv.className += " items-center";
                const card = document.createElement('div');
                card.className = "w-full bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 shadow-sm text-slate-800";
                
                const providerObj = providers.find(p => p.name.toLowerCase() === currentChatProvider.toLowerCase());
                
                const FIVE_HOURS_MS = 5 * 60 * 60 * 1000;
                let isAccepted = (m.status === 'accepted');
                
                if (isAccepted && m.acceptedAt) {
                    const elapsed = Date.now() - m.acceptedAt;
                    if (elapsed > FIVE_HOURS_MS) {
                        isAccepted = false;
                    }
                }

                const rawPhone = providerObj ? providerObj.phone : "";
                const displayPhone = (isAccepted && rawPhone) ? rawPhone : "Hidden until accepted";

                let statusBadge = `<span class="bg-amber-200 text-amber-900 text-[10px] font-bold px-2.5 py-1 rounded-full">Pending Response</span>`;
                if (isAccepted) statusBadge = `<span class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-circle-check mr-1"></i> Booking Confirmed (5h Auto-Lock)</span>`;
                if (m.status === 'cancelled') statusBadge = `<span class="bg-rose-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-circle-xmark mr-1"></i> Cancelled</span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-amber-200/80">
                        <span class="text-xs font-bold text-amber-900 flex items-center"><i class="fa-solid fa-calendar-check text-amber-600 mr-1.5 text-sm"></i> Job Request</span>
                        ${statusBadge}
                    </div>
                    <div class="space-y-1.5 mb-3 text-xs font-semibold text-slate-700">
                        <p class="flex items-center"><i class="fa-regular fa-calendar text-emerald-600 w-5 text-sm"></i> Date: <span class="ml-1 font-bold text-slate-900">${m.date}</span></p>
                        <p class="flex items-center"><i class="fa-regular fa-clock text-emerald-600 w-5 text-sm"></i> Time: <span class="ml-1 font-bold text-slate-900">${m.time}</span></p>
                        <p class="flex items-start mt-1"><i class="fa-regular fa-note-sticky text-emerald-600 w-5 text-sm mt-0.5"></i> Note: <span class="ml-1 font-medium text-slate-800">${m.note || 'None'}</span></p>
                    </div>

                    ${isAccepted ? `
                        <div class="bg-emerald-100/70 border border-emerald-300 rounded-xl p-2.5 text-center mt-2">
                            <p class="text-[11px] font-bold text-emerald-900 mb-1"><i class="fa-solid fa-phone mr-1"></i> Provider Contact Unlocked (Auto-locks in 5 hrs):</p>
                            <a href="tel:${displayPhone}" class="text-xs font-extrabold text-emerald-700 underline">${displayPhone}</a>
                        </div>
                    ` : `
                        <div class="bg-slate-100 border border-slate-200 rounded-xl p-2 text-center text-[11px] text-slate-500 font-medium">
                            <i class="fa-solid fa-lock mr-1 text-slate-400"></i> Contact hidden until booking accepted
                        </div>
                    `}

                    ${(!isAccepted && m.status !== 'cancelled') ? `
                        <div class="flex space-x-2 pt-2 mt-2 border-t border-amber-200/60">
                            <button onclick="cancelBookingRequest('${msgKey}')" class="flex-1 bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold py-2 rounded-xl text-xs transition">Decline</button>
                            <button onclick="initiateBookingAccept('${msgKey}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs shadow-sm transition">Accept Request</button>
                        </div>
                    ` : ''}
                `;
                wrapperDiv.appendChild(card);
                msgBox.appendChild(wrapperDiv);
                msgBox.scrollTop = msgBox.scrollHeight;
            }
        }

        const translations = {
            en: { subtitle: "Local Services Marketplace", search_placeholder: "Search photo, video, Greenwood, NC...", cat_all: "All Services", cat_media: "Video & Photography", cat_music_class: "Music Classes", cat_sound: "Sound & Live Stream", cat_hvac: "Electrical, Heating & A/C", cat_roofing: "Roofing & Painting", cat_security: "Home Security", cat_plumbing: "Plumbing", cat_appliance: "Appliance Repair", cat_handyman: "Handyman", cat_cleaning: "Home Cleaning", cat_lawn: "Lawn & Yard", cat_towing: "Towing Service", cat_locksmith: "Locksmith", cat_moving: "Moving & Hauling", verified_title: "Verified Nearby Providers", direct_chat: "Chat & Inquire", nav_home: "Home" },
            my: { subtitle: "ဒေသတွင်း ဝန်ဆောင်မှု ဈေးကွက်", search_placeholder: "ဓာတ်ပုံ၊ ဗီဒီယို၊ မြို့ သို့မဟုတ် နိုင်ငံ ရှာရန်...", cat_all: "ဝန်ဆောင်မှု အားလုံး", cat_media: "ဗီဒီယိုနှင့် ဓာတ်ပုံ", cat_music_class: "ဂီတသင်တန်းများ", cat_sound: "အသံနှင့် တိုက်ရိုက်ထုတ်လွှင့်မှု", cat_hvac: "မီး၊ အပူပေးစက်နှင့် အဲယားကွန်း", cat_roofing: "ခေါင်မိုးနှင့် ဆေးသုတ်ခြင်း", cat_security: "အိမ်သုံးလုံခြုံရေး", cat_plumbing: "ပိုက်ပြင်ဆင်ခြင်း", cat_appliance: "အိမ်သုံးပစ္စည်းပြင်ဆင်ခြင်း", cat_handyman: "လက်သမားနှင့် အထွေထွေပြင်ဆင်မှု", cat_cleaning: "အိမ်သန့်ရှင်းရေး", cat_lawn: "ခြံစည်းရိုးနှင့် မြက်ခင်းပြင်", cat_towing: "ယာဉ်ဆွဲဝန်ဆောင်မှု", cat_locksmith: "သော့ပြင်ဝန်ဆောင်မှု", cat_moving: "အိမ်ပြောင်းရွှေ့ဝန်ဆောင်မှု", verified_title: "အနီးအနားရှိ အတည်ပြုပြီး ဝန်ဆောင်မှုပေးသူများ", direct_chat: "စကားပြောရန်", nav_home: "ပင်မ" }
        };

        window.changeLanguage = function(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) el.placeholder = translations[lang][key];
            });
            filterProviders();
        };

        document.addEventListener('DOMContentLoaded', () => { 
            getUserLocation();
            updateNotifBadge();
        });
    </script>
